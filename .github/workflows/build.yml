name: Build Genuine RPK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Auto-Unpack and Generate Structures
        run: |
          # 1. Создаем чистую временную папку для идеальной сборки
          mkdir -p build_env/src/common
          mkdir -p build_env/src/pages/index
          
          # 2. Ищем и распаковываем Archive.zip во временную папку, если он есть
          ZIP_PATH=$(find . -name "Archive.zip" | head -n 1)
          if [ -n "$ZIP_PATH" ]; then
            echo "Найдено архив: $ZIP_PATH, распаковываем..."
            unzip -o "$ZIP_PATH" -d temp_unpacked/
          fi
          
          # 3. Находим файлы внутри репозитория или внутри распакованного архива
          INDEX_PATH=$(find . -name "index.ux" | head -n 1)
          MANIFEST_PATH=$(find . -name "manifest.json" | head -n 1)
          APP_PATH=$(find . -name "app.ux" | head -n 1)
          
          if [ -z "$INDEX_PATH" ] || [ -z "$MANIFEST_PATH" ] || [ -z "$APP_PATH" ]; then
            echo "Критическая ошибка: Файлы проекта не найдены ни в корне, ни в архиве!"
            exit 1
          fi
          
          # 4. Копируем файлы в окружение сборщика, исправляя структуру папок
          cp "$INDEX_PATH" build_env/src/pages/index/index.ux
          cp "$MANIFEST_PATH" build_env/src/manifest.json
          cp "$APP_PATH" build_env/src/app.ux
          
          # 5. Создаем правильный package.json в папке сборки
          cat << 'EOF' > build_env/package.json
          {
            "name": "fifteenpuzzle",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "aiot build",
              "release": "aiot release"
            },
            "devDependencies": {
              "aiot-toolkit": "latest"
            }
          }
          EOF
          
          # 6. Генерируем цифровой ключ подписи для предотвращения перезагрузок браслета
          cd build_env
          npx aiot openssl genrsa -out private.pem 2048
          mkdir -p sign
          cp private.pem sign/private.pem
          
      - name: Compile Official Signed RPK
        run: |
          cd build_env
          npm install
          
          # Запускаем официальную сборку релиза с компиляцией в бинарный байт-код
          npx aiot release
          
          # Создаем выходную папку и забираем скомпилированный .rpk
          mkdir -p ../final_output
          find dist -name "*.rpk" -exec cp {} ../final_output/ \;
          
      - name: Upload Genuine RPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: final_output/
          if-no-files-found: error
