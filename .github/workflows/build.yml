name: Build RPK Direct
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Project
        run: |
          if [ -d "Archive" ]; then
            cd Archive
          fi
          npm install
          npx aiot build
          
          # Создаем общую папку для артефактов в самом корне репозитория
          mkdir -p $GITHUB_WORKSPACE/rpk_output
          
          # Ищем скомпилированный .rpk файл во всех созданных папках и копируем его
          find . -name "*.rpk" -not -path "*/node_modules/*" -exec cp {} $GITHUB_WORKSPACE/rpk_output/ \;
          
          # Проверяем, нашелся ли файл
          ls -la $GITHUB_WORKSPACE/rpk_output/
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: rpk_output/*.rpk
          if-no-files-found: error
