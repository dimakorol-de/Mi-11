name: Build Genuine RPK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Auto-Fix and Generate Structures
        run: |
          # 1. Находим, где на самом деле лежит index.ux (даже в src. с точкой)
          INDEX_PATH=$(find . -name "index.ux" | head -n 1)
          MANIFEST_PATH=$(find . -name "manifest.json" | head -n 1)
          APP_PATH=$(find . -name "app.ux" | head -n 1)
          
          # 2. Создаем временную чистую папку для идеальной сборки
          mkdir -p build_env/src/common
          mkdir -p build_env/src/pages/index
          
          # 3. Копируем файлы туда, принудительно исправляя пути
          cp "$INDEX_PATH" build_env/src/pages/index/index.ux
          cp "$MANIFEST_PATH" build_env/src/manifest.json
          cp "$APP_PATH" build_env/src/app.ux
          
          # 4. Создаем правильный package.json в папке сборки
          cat << 'EOF' > build_env/package.json
          {
            "name": "fifteenpuzzle",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "aiot build",
              "release": "aiot release"
            },
            "devDependencies": {
              "aiot-toolkit": "latest"
            }
          }
          EOF
          
          # 5. Генерируем цифровой ключ подписи, чтобы браслет не перезагружался
          cd build_env
          npx aiot openssl genrsa -out private.pem 2048
          mkdir -p sign
          cp private.pem sign/private.pem
          
      - name: Compile Official Signed RPK
        run: |
          cd build_env
          npm install
          
          # Запускаем официальную сборку релиза с компиляцией в байт-код
          npx aiot release
          
          # Создаем выходную папку и вытаскиваем скомпилированный .rpk
          mkdir -p ../final_output
          find dist -name "*.rpk" -exec cp {} ../final_output/ \;
          
      - name: Upload Genuine RPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: final_output/
          if-no-files-found: error
