name: Build RPK Debug
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Project
        run: |
          # Автоматически находим, где лежит manifest.json, и заходим туда
          MANIFEST_DIR=$(dirname $(find . -name "manifest.json" | head -n 1))
          echo "Папка проекта определена как: $MANIFEST_DIR"
          cd "$MANIFEST_DIR"
          
          # Если мы зашли внутрь папки src, нужно подняться на уровень выше к package.json
          if [ "$(basename "$PWD")" = "src" ]; then
            cd ..
          fi
          
          echo "Текущая папка сборки: $PWD"
          npm install
          npx aiot build
          
          # Магия: ищем ВСЕ файлы .rpk в репозитории без исключений
          mkdir -p $GITHUB_WORKSPACE/rpk_output
          find $GITHUB_WORKSPACE -name "*.rpk" -exec cp {} $GITHUB_WORKSPACE/rpk_output/ \;
          
          echo "--- СПИСОК НАЙДЕННЫХ ФАЙЛОВ RPK ---"
          ls -la $GITHUB_WORKSPACE/rpk_output/ || echo "Папка пуста"
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: rpk_output/
          if-no-files-found: warn
